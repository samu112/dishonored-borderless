; DishonoredBorderless - configuration
;
; Goes next to d3d9.dll, i.e. in Dishonored\Binaries\Win32.
; Delete the file to fall back to these same defaults.

[Borderless]

; Master switch. 0 makes d3d9.dll a pure pass-through to the system DLL.
Enabled=1

; Window size. 0 means "the full size of the target monitor", which is what you
; want for borderless fullscreen. A smaller explicit size is centred on the
; monitor; the backbuffer follows it, so this doubles as a resolution override.
ResolutionWidth=0
ResolutionHeight=0

; 0  = the monitor the game window opens on (usually the primary).
; 1..N = that monitor in EnumDisplayMonitors order.
TargetMonitorIndex=0

; Subclass the game's window procedure. This is what stops the game putting its
; own borders and fixed size back (plan.md 4.3). With this off, only the
; watchdog below maintains the window, which is visibly worse.
EnableWndProcHook=1

; Rewrite D3DPRESENT_PARAMETERS.Windowed to TRUE at CreateDevice/Reset. This is
; what makes the game render into a window at all instead of taking exclusive
; fullscreen.
ForceWindowed=1

; MatchBackBufferToWindow was removed in 1.0.1 and is ignored if you still have
; it here. It resized the backbuffer behind the game's back, which broke every
; resolution except your monitor's own: the game kept drawing at the size it
; asked for, into one corner of a bigger buffer. The game's chosen resolution is
; now always honoured, and Present scales it to fill the borderless window.

; Swallow SC_MINIMIZE. Dishonored is widely reported to minimise or flicker when
; it loses focus while something else manages its window.
BlockMinimizeOnFocusLoss=1

; Keep the window above everything else. Off by default: it makes alt-tabbing
; and overlays worse, and borderless does not need it.
Topmost=0

; Make the process DPI-aware. Required for a sharp image on a display with
; scaling above 100%: a DPI-unaware process is told the desktop is smaller than
; it is, and the compositor upscales the result. See README 'Blurry image'.
SetDpiAwareness=1

; Watchdog period in milliseconds. Re-applies the style and geometry, and
; re-attaches if the game recreates its window. 0 disables it.
EnforceIntervalMs=250

; off | error | info | debug | trace
LogLevel=info
LogFile=DishonoredBorderless.log
